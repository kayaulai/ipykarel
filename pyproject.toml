[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipykarel"
version = "0.1.2"
description = "Karel the Robot exercises in Jupyter Notebooks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ryan Ka Yau Lai" }
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "ipython>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["ipykarel"]

[tool.setuptools.package-data]
ipykarel = ["fonts/*.ttf"]
